# A link to a document listed here is allowed even though the file does not exist
# yet; a link to anything NOT listed here and NOT present is a build failure.
#
# This is how the architecture docs are permitted to reference the system they
# describe before it is written, without the linter degrading into noise.
#
# Rules enforced by tools/docs-lint/lint.rb:
